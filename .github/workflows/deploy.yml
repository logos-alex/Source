name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # needed for git-based lastmod in sitemap

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.11.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Verify Node.js version
        run: node -v

      - name: Normalize npm proxy config
        run: |
          npm config delete proxy || true
          npm config delete http-proxy || true
          npm config delete https-proxy || true

      - name: Install dependencies
        run: env -u npm_config_http_proxy -u npm_config_https_proxy -u NPM_CONFIG_HTTP_PROXY -u NPM_CONFIG_HTTPS_PROXY npm ci

      - name: Build project
        run: env -u npm_config_http_proxy -u npm_config_https_proxy -u NPM_CONFIG_HTTP_PROXY -u NPM_CONFIG_HTTPS_PROXY npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      # actions/deploy-pages#451: רשימת החפצים ב־API מפגרת אחר ההעלאה,
      # ו־deploy-pages נכשל לסירוגין ב"No artifacts named github-pages"
      # מיד אחרי upload-pages-artifact באותה עבודה. ממתינים עד שהחפץ נרשם.
      - name: Wait for the Pages artifact to become visible
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 24); do
            if curl -sf --max-time 15 \
                 -H "Authorization: Bearer $GITHUB_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
                 | grep -q '"name": *"github-pages"'; then
              echo "Pages artifact is visible (check #$i)."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::github-pages artifact still not listed after 120s; letting deploy-pages try anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # actions/deploy-pages#451: כשל לסירוגין במציאת החפץ (תקלת צד של
        # גיטהאב, מקובלת בימים אלה). הניסיון הראשון רך; אם נכשל — ניסיון נוסף.
        continue-on-error: true

      - name: Wait before retrying the Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Retry the Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
